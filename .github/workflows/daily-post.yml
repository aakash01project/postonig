name: Daily Yoga Post

on:
  schedule:
    - cron: "42 1 * * *"    # 01:42 UTC = 7:12 AM IST daily (odd minute: GitHub is less busy than at :00 / :30)
    # Backup (optional): remove the '#' on the next line to also try at 8:12 AM IST. It skips if today's post is already done.
    # - cron: "42 2 * * *"
  workflow_dispatch:         # lets you run it manually to test
    inputs:
      dry_run:
        description: "Test only: make the picture + caption but do NOT post (tick this to test safely)"
        type: boolean
        default: false
      force:
        description: "Post even if today's post is already done (use only on purpose)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Hindi font
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-core libfribidi0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python post_daily.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
      - name: Save test preview (only in test mode)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            preview.jpg
            preview_caption.txt
